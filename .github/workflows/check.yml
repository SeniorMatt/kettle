# Work-in-progress branches (wip-*): compile everything, list every error, then run the tests.
name: Check

on:
  push:
    branches: ["wip-*"]

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-targets --keep-going --message-format short
      - name: Test
        run: |
          cargo build -p sr-steamclient
          cargo test --workspace --no-fail-fast
      - name: Clippy
        run: cargo clippy --workspace --all-targets --keep-going --message-format short -- -D warnings
      - name: Screenshots
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers ffmpeg xdotool libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 libvulkan1 >/dev/null
          cargo build -p kettle
          scripts/ci-screenshots.sh target/debug/kettle shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
