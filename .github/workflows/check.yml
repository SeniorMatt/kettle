# Work-in-progress branches (wip-*): compile everything, list every error, then run the tests.
name: Check

on:
  push:
    branches: ["wip-*"]

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: SDL2 runtime (the overlay test program links it) and the 32-bit C runtime (the i686 overlay library)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-2.0-0 gcc-multilib
      - name: 32-bit overlay library
        run: cargo build -p sr-overlay-hook --lib --target i686-unknown-linux-gnu
      - name: Check
        run: cargo check --workspace --all-targets --keep-going --message-format short
      - name: Test
        run: |
          cargo build -p sr-steamclient
          cargo test --workspace --no-fail-fast
      - name: Clippy
        run: cargo clippy --workspace --all-targets --keep-going --message-format short -- -D warnings
      - name: Screenshots
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers ffmpeg xdotool libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 libvulkan1 >/dev/null
          cargo build -p kettle
          scripts/ci-screenshots.sh target/debug/kettle shots
          SHOT_WAIT=25 scripts/readme-screenshots.sh target/debug/kettle shots/readme
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-shots
          path: target/overlay-shots/
      - name: Overlay library on a virtual screen
        if: always()
        run: |
          sudo apt-get install -y -qq mesa-utils libgl1-mesa-dri vulkan-tools x11-apps ffmpeg xdotool xvfb mesa-vulkan-drivers libnotify4 libcurl4 libpulse0 libsamplerate0 libfreetype6 libsdl2-2.0-0 >/dev/null
          cargo build -p sr-overlay-hook --lib --example sdl_test
          scripts/overlay-test.sh target/overlay-hook
          scripts/overlay-gl-vk-test.sh target/overlay-hook
          scripts/overlay-ddnet-test.sh target/overlay-hook
          scripts/overlay-kettle-test.sh target/overlay-hook
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-hook-shots
          path: target/overlay-hook/
