# Builds the Linux AppImage on GitHub's machines.
# - Push a tag like v0.1.0-alpha.4: tests, builds, attaches the AppImage to that tag's
#   release (creating a pre-release if there is none, publishing it if it is a draft).
# - Run by hand (Actions > Release > Run workflow): tests and builds; the AppImage is
#   kept as a downloadable workflow artifact.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # The oldest supported runner, so the AppImage runs on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: |
          cargo build -p sr-steamclient
          cargo test --workspace --locked

      - name: Build AppImage
        run: scripts/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: kettle-x86_64.AppImage
          path: dist/kettle-x86_64.AppImage

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --title "Kettle ${TAG#v}" --notes "Linux AppImage."
          fi
          gh release upload "$TAG" dist/kettle-x86_64.AppImage --clobber
          gh release edit "$TAG" --draft=false
