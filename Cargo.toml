[workspace]
resolver = "3"
members = ["crates/model", "crates/steam", "crates/client", "crates/steamclient", "crates/ui", "crates/app"]

[workspace.package]
version = "0.1.0-alpha.6"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
