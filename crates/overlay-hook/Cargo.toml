[package]
name = "sr-overlay-hook"
description = "libkettle_overlay.so: draws Kettle's overlay inside a game's own frames (OpenGL, Vulkan layer) and takes the game's input while it is open."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kettle_overlay"
crate-type = ["cdylib", "rlib"]

[dependencies]
sr-overlay-proto = { path = "../overlay-proto" }
sr-overlay-ui = { path = "../overlay-ui" }
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
egui_glow = { version = "=0.36.2", default-features = false }
ash = { version = "0.38", default-features = false, features = ["std"] }
libc = "0.2"

[build-dependencies]
naga = { version = "30", default-features = false, features = ["wgsl-in", "spv-out"] }
