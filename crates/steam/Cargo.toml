[package]
name = "sr-steam"
description = "Everything that talks to Steam or the disk: login, CM, Web API, local installs, keyring, cache."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
directories = "6"
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
prost = "0.14"
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
steam-vent = "0.5"
steam-vent-proto-steam = "0.5"
tokio-stream = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
