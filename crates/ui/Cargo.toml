[package]
name = "sr-ui"
description = "egui views, widgets and the theme (design tokens). No I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sr-model = { path = "../model" }
sr-client = { path = "../client" }
sr-steam = { path = "../steam" }
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
egui-phosphor = { version = "0.14", default-features = false, features = ["regular", "fill"] }
