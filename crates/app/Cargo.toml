[package]
name = "steam-rust"
description = "The steam-rust desktop app: window setup and wiring."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sr-client = { path = "../client" }
sr-ui = { path = "../ui" }
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# The global Shift+Tab shortcut for the in-game overlay (see src/hotkey.rs).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
async-io = "2"
futures-util = "0.3"
futures-channel = "0.3"
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
