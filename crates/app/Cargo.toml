[package]
name = "kettle"
description = "The kettle desktop app: window setup and wiring."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sr-client = { path = "../client" }
sr-ui = { path = "../ui" }
sr-model = { path = "../model" }
sr-steam = { path = "../steam" }
sr-overlay-proto = { path = "../overlay-proto" }
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# The system tray icon (StatusNotifierItem over D-Bus; KDE and others), see src/tray.rs. MIT.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
